camera:
  width: 640
  height: 480

detector:
  model_path: models/license-plate-finetune-v1n.onnx
  input_size: 640
  confidence: 0.45
  nms_threshold: 0.45

ocr:
  language: eng
  min_confidence: 0

access:
  allowed_plates_file: config/allowed_plates.txt
  required_confirmations: 1
  cooldown_seconds: 1

barrier:
  pwm_channel: 1
  pwm_chip: 0
  frequency_hz: 50
  min_pulse_width_ms: 1.0
  max_pulse_width_ms: 2.0
  closed_angle: 180
  opened_angle: 90
  open_duration: 7

display:
  # false works with opencv-python-headless; set true only with GUI-enabled OpenCV
  enabled: false

processing:
  interval_seconds: 2
